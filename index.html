<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinamika Dominansi · LKM Keanekaragaman Hayati</title>
<meta name="description" content="LKM Keanekaragaman Hayati: prediksi dominansi tumbuhan pada tiga skenario kasus.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17301f; --muted:#456650;
  --cream:#fffbe3; --cream-2:#f3e9b0; --edge:#d9ca7a;
  --leaf:#178a3c; --leaf-dark:#0f6428; --leaf-soft:#d9f0b6;
  --bad:#c62828; --bad-soft:#fde4e1; --ok:#1b7d3a; --ok-soft:#dff3df;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{background:#8cca62;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font:400 1rem/1.55 var(--body);color:var(--ink);position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,#e6f6c3 0,#b8e085 40%,#6fbf55 100%)}
.foliage{position:fixed;inset:0;z-index:-1;pointer-events:none}
.foliage svg{width:100%;height:100%;display:block}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
a{color:inherit}
:focus-visible{outline:3px solid #1b4fd8;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar (halaman kasus) */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-top:14px;padding-bottom:6px}
.back{font-weight:800;text-decoration:none;background:var(--cream);border:2px solid var(--cream-2);border-radius:999px;padding:5px 14px}
.back:hover{background:#fff}
.kname{font:600 1rem var(--display);background:var(--cream);border-radius:999px;padding:5px 14px;border:2px solid var(--cream-2)}
.steps{display:flex;gap:8px;list-style:none;margin:0 0 0 auto;padding:0;flex-wrap:wrap}
.steps li{font-weight:800;font-size:.9rem;border-radius:999px;border:2px solid var(--cream-2);background:var(--cream)}
.steps a,.steps li.lock{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 5px;text-decoration:none}
.steps li.lock{opacity:.55}
.steps .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--cream-2);font-size:.8rem}
.steps li.cur{background:var(--leaf);border-color:var(--leaf-dark);color:#fff}
.steps li.cur .n{background:#fff;color:var(--leaf-dark)}

/* panel */
main{padding:10px 0 36px}
.panel{background:var(--cream);border:3px solid var(--cream-2);border-radius:24px;padding:clamp(16px,3vw,28px);box-shadow:0 8px 0 rgba(23,70,35,.18),0 22px 34px -14px rgba(23,70,35,.4)}
.panel+.panel{margin-top:18px}
.muted{color:var(--muted)}

/* beranda */
.hero{text-align:center;margin:26px auto 22px;max-width:760px;padding-top:26px;padding-bottom:22px}
.hero h1{font-size:clamp(2.3rem,8vw,3.9rem);font-weight:700;color:#174a2a;
  text-shadow:-3px -3px 0 var(--cream),3px -3px 0 var(--cream),-3px 3px 0 var(--cream),3px 3px 0 var(--cream),0 6px 0 var(--edge);margin-bottom:12px}
.hero p{margin:0;font-weight:700;font-size:1.05rem}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.kcard{position:relative;display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--cream);border:3px solid var(--cream-2);border-radius:22px;padding:12px 12px 14px;text-align:center;box-shadow:0 7px 0 rgba(23,70,35,.2);transition:transform .15s ease}
.kcard:hover{transform:translateY(-4px)}
.thumb{position:relative;display:block;aspect-ratio:300/188;border-radius:14px;overflow:hidden;margin-bottom:8px;background:#cfe9b0}
.thumb svg,.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.thumb.has-img{background:var(--cream-2)}
.thumb.has-img svg{display:none}
.klabel{font:600 1.45rem var(--display)}
.ksub{font-weight:700;color:var(--muted);font-size:.92rem}
.done{position:absolute;top:20px;right:20px;background:var(--leaf);color:#fff;font-weight:800;font-size:.8rem;border-radius:999px;padding:3px 10px}
.pill-foot{text-align:center;margin-top:26px}
.pill-foot span{display:inline-block;background:var(--cream);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.85rem;border:2px solid var(--cream-2)}

/* kredit */
.credit{max-width:560px;margin:30px auto 0;padding:18px 24px 22px;text-align:center}
.credit h2{font-size:1.1rem;color:var(--muted);font-weight:600}
.credit .grp{font:600 1.55rem var(--display);margin:2px 0 14px}
.credit ul{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;max-width:440px;text-align:left}
.credit li{display:flex;align-items:center;gap:10px;font-weight:700;background:#fff;border:2px solid var(--cream-2);border-radius:12px;padding:7px 12px}
.credit li::before{content:"";flex:none;width:11px;height:11px;border-radius:60% 0 60% 0;background:var(--leaf);transform:rotate(-8deg)}
@media (max-width:480px){.credit ul{grid-template-columns:1fr}}

/* page 2 */
.latar h2{font-size:1.25rem;margin-bottom:6px}
.latar p{margin:0;font-size:.95rem}
.latar{background:#fff;border:3px solid var(--cream-2);border-radius:16px;padding:12px 16px;margin-bottom:18px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.th{text-align:center;font-size:1.15rem;margin-bottom:8px}
.box{display:block;width:100%;height:auto;aspect-ratio:3/2;background:#fff;border:3px solid var(--edge);border-radius:14px}
.lg-title{font:600 .95rem var(--display);margin:14px 0 6px;text-align:center;background:var(--leaf-soft);border-radius:10px;padding:3px 8px}
.arow{display:flex;align-items:center;gap:10px;min-height:54px}
.arow .rate{font-weight:800;line-height:1.25}
.arow input{width:100%;max-width:150px;margin:0 auto;height:44px;border:3px solid var(--edge);border-radius:12px;background:#fff;font:800 1.2rem var(--body);text-align:center;color:var(--ink)}
.arow input.ok{border-color:var(--ok);background:var(--ok-soft)}
.arow input.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.arow input.rev{border-color:#c98a00;background:#fff3cd}
.arow input[readonly]{cursor:default}
.arow .mini{display:none}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-top:20px}
.foot .note{flex:1 1 320px;margin:0;font-size:.95rem;font-weight:600}
.foot-actions{display:flex;align-items:center;gap:14px;margin-left:auto}
.status{min-height:1.6em;margin:12px 0 0;font-weight:800}
.btn{font:600 1.05rem var(--display);background:var(--leaf);color:#fff;border:0;border-radius:999px;padding:11px 28px;box-shadow:0 4px 0 var(--leaf-dark);cursor:pointer;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--leaf-dark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--leaf-dark);border:2px solid var(--leaf);box-shadow:0 4px 0 #b9d8a2;padding:9px 22px}
.next{display:inline-grid;flex:none;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf-dark);text-decoration:none;animation:pop .45s ease}
.next:hover{background:#1ba046}
.next svg{width:28px;height:28px}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

/* page 3 */
.match{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;margin-top:14px}
.mtable{display:grid;gap:10px;min-width:0}
.mhead,.mrow{display:grid;grid-template-columns:.8fr 1.3fr 1.3fr;gap:10px}
.mhead>div{background:var(--leaf-soft);border-radius:12px;padding:7px 10px;font:600 .95rem var(--display);text-align:center}
.mcell{min-width:0}
.mcell.fixed{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--edge);border-radius:14px;padding:10px 12px;font-weight:800;line-height:1.25}
.lab-narrow{display:none}
.dcard{display:flex;gap:6px;align-items:flex-start;height:100%;background:#fff;border:3px solid var(--edge);border-radius:14px;padding:8px 10px 8px 4px;position:relative}
.dcard.ok{border-color:var(--ok);background:var(--ok-soft)}
.dcard.bad{border-color:var(--bad);background:var(--bad-soft)}
.dcard.rev{border-color:#c98a00;background:#fff3cd}
.dcard .body{flex:1;min-width:0;padding-right:18px}
.dcard .cd{display:block;font-size:.88rem;line-height:1.4;margin-top:2px}
.dcard .latin{font-size:.85rem}
.dcard .mkt{position:absolute;top:6px;right:9px;font-weight:800}
.dcard.ok .mkt{color:var(--ok)} .dcard.bad .mkt{color:var(--bad)} .dcard.rev .mkt{color:#8a5d00}
.grip{flex:none;width:30px;align-self:stretch;min-height:40px;background:none;border:0;border-radius:8px;cursor:grab;touch-action:none;color:var(--muted);display:grid;place-items:center;padding:0}
.grip:hover:not(:disabled){background:var(--cream-2)}
.grip:disabled{cursor:default;opacity:.35}
.grip svg{width:16px;height:22px}
.dcard.lifted{opacity:.35}
.dcard.ghost{position:fixed;z-index:60;margin:0;height:auto;pointer-events:none;border-color:var(--leaf);box-shadow:0 14px 26px rgba(0,0,0,.3);transform:rotate(1.2deg)}
.mcell.target .dcard{outline:3px dashed var(--leaf);outline-offset:3px}
.hearts{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:3px solid var(--edge);border-radius:18px;padding:10px 10px 12px}
.hearts .hl{font:600 .85rem var(--display);color:var(--muted)}
.hearts.row{flex-direction:row;gap:4px;padding:5px 14px 5px 12px}
.hearts.row .hl{margin-left:6px}
.hearts.row .heart{width:28px;height:28px}
.hbar{display:flex;justify-content:flex-end;margin:-4px 0 12px}
.heart{width:36px;height:36px;display:block}
.heart.on{fill:#e53935}
.heart.off{fill:#fff;stroke:#b5b5b5;stroke-width:1.6}
.heart.pop{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-8deg)}60%{transform:translateX(5px) rotate(8deg)}}
.over{background:var(--bad-soft);border:3px solid var(--bad);border-radius:16px;padding:14px;margin:14px 0 0;text-align:center}
.over p{margin:0 0 10px;font-weight:800}

/* page 4 */
.stage{max-width:620px;margin:16px auto 0;text-align:center}
.stage .box.big{box-shadow:0 6px 0 rgba(23,70,35,.15)}
.tl{font:600 1.3rem var(--display);margin:12px 0 4px}
.ctrl{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.ctrl input[type=range]{flex:1;accent-color:var(--leaf);min-width:0}
.live{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center}
.live li{display:flex;align-items:center;gap:6px;font-weight:800}
.verdict{margin:18px auto 0;max-width:620px;background:#fff;border:3px solid var(--edge);border-radius:14px;padding:12px 16px;font-weight:700}

@media (max-width:760px){
  .kgrid{grid-template-columns:1fr}
  .board{grid-template-columns:1fr;gap:26px}
  .arow .mini{display:inline-flex}
  .arow input{margin:0;max-width:none}
  .match{grid-template-columns:1fr}
  .hearts{flex-direction:row;justify-content:center;order:-1}
  .mhead{display:none}
  .mrow{grid-template-columns:1fr;background:rgba(255,255,255,.55);border-radius:18px;padding:10px}
  .lab-narrow{display:block;font:600 .8rem var(--display);color:var(--muted);margin-bottom:2px}
  .dcard{height:auto}
  .mcell.drag::before{content:attr(data-lab);display:block;font:600 .8rem var(--display);color:var(--muted);margin:2px 0 2px 4px}
  .steps{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  .next,.heart.pop{animation:none}
  .kcard{transition:none}
}
</style>
</head>

/* acak urutan kartu; tidak ada kartu yang kebetulan sudah di baris yang benar */
function shuffleDiff(keys){
  var b,n=0;
  do{
    b=keys.slice();
    for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; }
    n++;
  }while(!b.every(function(x,i){ return x!==keys[i]; }) && n<500);
  return b;
}
function mulberry32(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; var t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

}

/* foto kartu: sembunyikan ilustrasi, dan buang tepi transparan supaya foto pas memenuhi kotak */
window.fitPhoto=function(img){
  img.parentNode.classList.add('has-img');
  if(img.dataset.fit) return; img.dataset.fit='1';
  try{
    var w=img.naturalWidth,h=img.naturalHeight; if(!w||!h) return;
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    var x=c.getContext('2d'); x.drawImage(img,0,0);
    var d=x.getImageData(0,0,w,h).data, x0=w,y0=h,x1=-1,y1=-1, i, px, py;
    for(py=0;py<h;py++){ for(px=0;px<w;px++){ if(d[(py*w+px)*4+3]>16){ if(px<x0)x0=px; if(px>x1)x1=px; if(py<y0)y0=py; if(py>y1)y1=py; } } }
    if(x1<0) return;
    var cw=x1-x0+1, ch=y1-y0+1;
    if(cw>=w-2&&ch>=h-2) return;
    var o=document.createElement('canvas'); o.width=cw; o.height=ch;
    o.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,cw,ch);
    img.src=o.toDataURL('image/png');
  }catch(e){ /* dibuka dari file lokal: browser menolak membaca piksel, foto tetap dipakai apa adanya */ }
};

/* ---------- canvas kotak putih ---------- */
var layouts={};
function layoutFor(sc){
  if(layouts[sc.id]) return layouts[sc.id];
  var W=360,H=240, fin=sc.key[1], total=fin.reduce(function(a,b){ return a+b; },0);
  var cols=Math.max(1,Math.ceil(Math.sqrt(total*W/H))), rows=Math.ceil(total/cols);
  var cw=W/cols, ch=H/rows, cell=Math.min(cw,ch), rng=mulberry32(sc.id*7919);
  var cells=[]; for(var r=0;r<rows;r++) for(var c=0;c<cols;c++) cells.push([c,r]);
  cells=cells.map(function(x){ return [rng(),x]; }).sort(function(a,b){ return a[0]-b[0]; }).map(function(x){ return x[1]; });
  var pos=[], idx=0;
  sc.plants.forEach(function(pl,j){
    var list=[];
    for(var i=0;i<fin[j];i++){
      var cc=cells[idx++];
      list.push({x:(cc[0]+.5)*cw+(rng()-.5)*cw*.3, y:(cc[1]+.5)*ch+(rng()-.5)*ch*.3});
    }
    pos.push(list);
  });
  layouts[sc.id]={W:W,H:H,pos:pos,size:Math.min(28,cell*.66)};
  return layouts[sc.id];
}
function drawBox(cv,sc,counts){
  if(!cv||!cv.getContext||typeof Path2D==='undefined') return;
  var ctx=cv.getContext('2d'); if(!ctx) return;
  var L=layoutFor(sc), dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.round(L.W*dpr)){ cv.width=Math.round(L.W*dpr); cv.height=Math.round(L.H*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,L.W,L.H);
  sc.plants.forEach(function(pl,j){
    ctx.fillStyle=pl.color;
    var n=Math.min(counts[j],L.pos[j].length);
    for(var i=0;i<n;i++){
      var p=L.pos[j][i];
      ctx.save(); ctx.translate(p.x-L.size/2,p.y-L.size/2); ctx.scale(L.size/24,L.size/24); ctx.fill(PATHS[pl.shape]); ctx.restore();
    }
  });
}
function boxLabel(sc,label,counts){
  var any=counts.some(function(n){ return n>0; });
  return label+': '+(any?counts.map(function(n,j){ return n+' '+sc.plants[j].name; }).join(', '):'kotak masih kosong');
}

function check3(sc){

    st.m3['p'+i]=po?'ok':'bad'; st.m3['r'+i]=ro?'ok':'bad';
    if(!po||!ro) wrong++;
  });
  if(wrong===0){
    st.solved=true; st.unlock=Math.max(st.unlock,4);
    st.msg3='Semua pasangan sudah tepat! Klik tanda panah untuk melihat simulasinya.';
    return;
  }
  st.hearts=Math.max(0,st.hearts-1); st.hit=true;
  if(st.hearts===0){
    var keys=P.map(function(p){ return p.key; });
    st.order={p:keys.slice(),r:keys.slice()};
    P.forEach(function(pl,i){ st.m3['p'+i]='rev'; st.m3['r'+i]='rev'; });
    st.solved=true; st.rev3=true; st.unlock=Math.max(st.unlock,4);

  }
}

function timeLabel(sc,t){
  if(sc.dates){
    var seg=t<2?0:1, f=Math.min(1,(t-2*seg)/2);
    var a=new Date(sc.dates[seg][0],sc.dates[seg][1],sc.dates[seg][2]).getTime();
    var b=new Date(sc.dates[seg+1][0],sc.dates[seg+1][1],sc.dates[seg+1][2]).getTime();
    var d=new Date(a+(b-a)*f);
    try{ return d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return d.toDateString(); }
  }
  return 'Bulan '+Math.floor(t+1e-9);
}
function verdict(sc){
  var P=sc.plants, fin=sc.key[1], ini=sc.initial;
  var top=function(v){ var m=Math.max.apply(null,v); return v.map(function(x,i){ return x===m?i:-1; }).filter(function(i){ return i>=0; }); };
  var tf=top(fin)[0], ti=top(ini), sum=fin.reduce(function(a,b){ return a+b; },0);
  var s='Di akhir pengamatan, '+P[tf].name+' paling dominan: '+Math.round(fin[tf]/sum*100)+'% dari '+sum+' individu.';
  if(ti.indexOf(tf)<0) s+=' Di awal, yang terbanyak adalah '+ti.map(function(i){ return P[i].name; }).join(' dan ')+', jadi dominansinya bergeser.';
  else s+=' '+P[tf].name+' sudah termasuk yang terbanyak sejak awal.';
  return s;
}
function page4(sc){
  var legend=sc.plants.map(function(pl,j){ return '<li>'+shapeSVG(pl,22)+'<span>'+pl.name+': <span id="live'+j+'">0</span></span></li>'; }).join('');
  return '<section class="panel">'+
    '<h2>Simulasi dominansi</h2>'+
    '<p style="margin:8px 0 0;font-weight:700">Berikut adalah simulasi visual perubahan dominansi vegetasi di '+sc.place+' dari '+sc.span+' berdasarkan hasil perhitungan dan analisis yang telah kamu lakukan!</p>'+
    '<div class="stage"><canvas class="box big" id="sim" width="360" height="240" role="img"></canvas>'+
    '<div class="tl" id="tl" aria-live="off"></div>'+
    '<div class="ctrl"><button type="button" class="btn alt" id="simtoggle" data-act="simtoggle">Jeda</button>'+
    '<input type="range" id="simrange" min="0" max="400" value="0" aria-label="Posisi waktu simulasi"></div>'+
    '<ul class="live">'+legend+'</ul></div>'+
    '<p class="verdict">'+verdict(sc)+'</p>'+
    '<div class="foot"><div class="foot-actions" style="margin-left:0"><a class="btn" href="#/">Pilih kasus lain</a></div></div>'+
    '</section>';
}
function drawSim(){
  var sc=sim.sc; if(!sc) return;
  var cn=countsAt(sc,sim.t), cv=document.getElementById('sim'); if(!cv) return;
  drawBox(cv,sc,cn);
  var lab=timeLabel(sc,sim.t);
  document.getElementById('tl').textContent=lab;
  cv.setAttribute('aria-label',boxLabel(sc,lab,cn));
  cn.forEach(function(n,j){ var el=document.getElementById('live'+j); if(el) el.textContent=n; });
  var rg=document.getElementById('simrange'); if(rg) rg.value=Math.round(sim.t*100);
  var tg=document.getElementById('simtoggle'); if(tg) tg.textContent=sim.playing?'Jeda':(sim.t>=4?'Putar ulang':'Putar');
}
function frame(ts){
  if(!sim.playing) return;
  if(sim.hold){
    if(ts>=sim.hold){ sim.hold=0; sim.t=0; }
  }else{
    sim.t+=(ts-sim.last)/DUR*4;
    if(sim.t>=4){
      sim.t=4;
      if(sim.loop){ sim.hold=ts+1800; } else { sim.playing=false; }
    }
  }
  sim.last=ts; drawSim();
  if(sim.playing) sim.raf=requestAnimationFrame(frame);
}
function playSim(){
  if(sim.t>=4) sim.t=0;
  sim.playing=true; sim.hold=0; sim.last=performance.now();
  cancelAnimationFrame(sim.raf); sim.raf=requestAnimationFrame(frame); drawSim();
}
function pauseSim(){ sim.playing=false; cancelAnimationFrame(sim.raf); drawSim(); }
function startSim(sc){
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  sim.sc=sc; sim.t=0; sim.loop=!reduce; sim.hold=0; sim.playing=false;
  drawSim();
  if(!reduce) playSim();
}
function stopSim(){ sim.playing=false; cancelAnimationFrame(sim.raf); }

/* ---------- render ---------- */
var lastKey=null;
function render(sig){
  stopSim();
  var r=route();
  if(r.home){
    document.title='Dinamika Dominansi · LKM Keanekaragaman Hayati';
    topnav.innerHTML=''; view.innerHTML=home();
  }else{
    var sc=SCENARIOS[r.k-1];
    document.title='Kasus '+r.k+' · Dinamika Dominansi';
    topnav.innerHTML=navHTML(r.k,r.p);
    if(r.p===2){ view.innerHTML=page2(sc); paint2(sc); }
    else if(r.p===3){ view.innerHTML=page3(sc); }
    else { S(r.k).finished=true; view.innerHTML=page4(sc); startSim(sc); }
  }
  var key=r.home?'home':r.k+'-'+r.p;
  if(key!==lastKey){ window.scrollTo(0,0); lastKey=key; }
  if(sig){
    var el=view.querySelector('[data-sig="'+sig+'"]');
    if(el&&!el.disabled) el.focus({preventScroll:true});
  }
}
window.addEventListener('hashchange',function(){ render(); });

/* ---------- interaksi ---------- */
view.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-act]'); if(!b) return;
  var a=b.dataset.act;
  if(a==='simtoggle'){ if(sim.playing) pauseSim(); else playSim(); return; }
  var r=route(); if(r.home) return;
  var sc=SCENARIOS[r.k-1], st=S(sc.id);
  if(a==='check2') check2(sc);
  else if(a==='check3') check3(sc);
  render(b.dataset.sig);
});

view.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='simrange'){ var v=el.value/100; pauseSim(); sim.t=v; drawSim(); return; }
  if(!el.matches||!el.matches('input[data-c]')) return;
  var r=route(), sc=SCENARIOS[r.k-1], st=S(sc.id), c=+el.dataset.c, j=+el.dataset.j;
  st.pred[c][j]=el.value; delete st.mark[c+'-'+j]; st.colOk[c]=false;
  el.classList.remove('ok','bad'); el.removeAttribute('aria-invalid');
  var cv=document.getElementById('box'+(c+1));
  if(cv){ drawBox(cv,sc,[0,0,0]); cv.setAttribute('aria-label',boxLabel(sc,sc.times[c+1],[0,0,0])); }
});

/* geser kartu (pointer: mouse, sentuh, pena) */
var drag=null;
view.addEventListener('pointerdown',function(e){
  var g=e.target.closest&&e.target.closest('.grip'); if(!g||g.disabled) return;
  if(e.pointerType==='mouse'&&e.button!==0) return;
  e.preventDefault();
  var cell=g.closest('.mcell'), card=cell.querySelector('.dcard'), rc=card.getBoundingClientRect();
  var ghost=card.cloneNode(true); ghost.classList.add('ghost');
  ghost.style.left=rc.left+'px'; ghost.style.top=rc.top+'px'; ghost.style.width=rc.width+'px';
  document.body.appendChild(ghost); card.classList.add('lifted');
  drag={col:cell.dataset.col,from:+cell.dataset.i,to:+cell.dataset.i,ghost:ghost,card:card,dx:e.clientX-rc.left,dy:e.clientY-rc.top,id:e.pointerId};
  try{ g.setPointerCapture(e.pointerId); }catch(err){}
});
window.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id) return;
  drag.ghost.style.left=(e.clientX-drag.dx)+'px'; drag.ghost.style.top=(e.clientY-drag.dy)+'px';
  var rows=[].slice.call(view.querySelectorAll('.mrow')), to=rows.length-1;
  for(var i=0;i<rows.length;i++){ if(e.clientY<rows[i].getBoundingClientRect().bottom){ to=i; break; } }
  if(to!==drag.to){
    drag.to=to;
    rows.forEach(function(row,i){
      var c=row.querySelector('.mcell[data-col="'+drag.col+'"]');
      if(c) c.classList.toggle('target',i===to&&i!==drag.from);
    });
  }
});
function endDrag(commit){
  if(!drag) return;
  var d=drag; drag=null; d.ghost.remove();
  if(commit&&d.to!==d.from){
    var r=route(), st=S(r.k), arr=st.order[d.col], it=arr.splice(d.from,1)[0];
    arr.splice(d.to,0,it); st.m3={}; st.msg3='';
    render('grip:'+d.col+':'+d.to);
  }else{
    d.card.classList.remove('lifted');
    [].slice.call(view.querySelectorAll('.target')).forEach(function(el){ el.classList.remove('target'); });
  }
}
window.addEventListener('pointerup',function(e){ if(drag&&e.pointerId===drag.id) endDrag(true); });
window.addEventListener('pointercancel',function(e){ if(drag&&e.pointerId===drag.id) endDrag(false); });

/* geser kartu dengan keyboard */
view.addEventListener('keydown',function(e){
  var g=e.target.closest&&e.target.closest('.grip'); if(!g||g.disabled) return;
  if(e.key!=='ArrowUp'&&e.key!=='ArrowDown') return;
  e.preventDefault();
  var r=route(), st=S(r.k), col=g.dataset.col, i=+g.dataset.i, j=i+(e.key==='ArrowUp'?-1:1), arr=st.order[col];
  if(j<0||j>=arr.length) return;
  var t=arr[i]; arr[i]=arr[j]; arr[j]=t; st.m3={}; st.msg3='';
  render('grip:'+col+':'+j);
});

render();
})();
</script>
